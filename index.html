        .controls {
            display: grid;
            grid-template-columns: repeat(3, 65px);
            grid-template-rows: repeat(3, 65px);
            gap: 12px;

        }
        .btn {
            background-color: #FFFFFF;
            border: 2px solid #FFCCD5;
            border-radius: 50%;
            color: #FF6B8B;

            display: flex;
            align-items: center;

<body>

    <div class="header">
        <h1>🍡 Chiikawa Snack Slither 🍰</h1>
        <div class="score-container">
            <div>Score: <span id="score">0</span></div>
            <div>Best: <span id="high-score">0</span></div>
        </div>
    </div>
    
    <div class="canvas-container">
        <!-- Interactive Start Overlay Menu -->
        <div id="startScreen" class="start-screen">
            <div class="chiikawa-btn-container" onpointerdown="pressStartButton()" onclick="pressStartButton()">
                <div class="chiikawa-btn-face"></div>
                <div class="chiikawa-btn-text">TAP TO PLAY</div>
            </div>
        </div>
        <canvas id="gameCanvas" width="320" height="320"></canvas>
    </div>
    
    <div class="controls">
        <div class="btn up" onpointerdown="changeDirection('UP')">▲</div>
        <div class="btn left" onpointerdown="changeDirection('LEFT')">◀</div>
        <div class="btn right" onpointerdown="changeDirection('RIGHT')">▶</div>
        <div class="btn down" onpointerdown="changeDirection('DOWN')">▼</div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 16; 
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}]; 
        let food = {x: 5, y: 5};
        let dx = 1; 
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("chiikawaHighScore") || 0;
        let gameInterval;
        let isPlaying = false;

        document.getElementById("high-score").innerText = highScore;

        // --- COMPATIBILITY BASE64 GRAPHICS ---
        const hachiwareImg = new Image();
        hachiwareImg.src = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiI+PGNpcmNsZSBjeD0iOCIgY3k9IjgiIHI9IjciIGZpbGw9IiNmZmZmZmYiLz48cGF0aCBkPSJNMSA1UTggLTEgMTUgNUwxNSAxUTggLTIgMSAxWiIgZmlsbD0iI0EwRTdFNSIvPjxjaXJjbGUgY3g9IjUiIGN5PSI3IiByPSIxIiBmaWxsPSIjMzMzIi8+PGNpcmNsZSBjeD0iMTEiIGN5PSI3IiByPSIxIiBmaWxsPSIjMzMzIi8+PHBhdGggZD0iTTUgMTBRIDggMTIgMTEgMTAiIHN0cm9rZT0iIzMzMyIgZmlsbD0ibm9uZSIgc3Ryb2tlLXdpZHRoPSIwLjgiLz48L3N2Zz4=";

        const chiikawaImg = new Image();
        chiikawaImg.src = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiI+PGNpcmNsZSBjeD0iOCIgY3k9IjgiIHI9IjciIGZpbGw9IiNmZmZmZmYiIHN0cm9rZT0iI0ZGQ0NENSIgc3Ryb2tlLXdpZHRoPSIwLjUiLz48Y2lyY2xlIGN4PSI1IiBjeT0iNyIgcj0iMSIgZmlsb+eM00MyIvPjxjaXJjbGUgY3g9IjExIiBjeT0iNyIgcj0iMSIgZmlsbD0iIzMzMyIvPjxjaXJjbGUgY3g9IjQiIGN5PSI4LjUiIHI9IjEiIGZpbGw9IiNGRkNDRDUiLz48Y2lyY2xlIGN4PSIxMiIgY3k9IjguNSIgcj0iMSIgZmlsbD0iI0ZGQ0NENSIvPjxwYXRoIGQ9Ik02LjUgMTBRIDggMTEgOS41IDEwIiBzdHJva2U9IiMzMzMiIGZpbGw9Im5vbmUiIHN0cm9rZS13aWR0aD0iMC44Ii8+PC9zdmc+";

        const usagiImg = new Image();
        usagiImg.src = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiI+PHJlY3QgeD0iMyIgeT0iMCIgd2lkdGg9IjIiIGhlaWdodD0iNSIgcng9IjEiIGZpbGw9IiNGRkY1RTEiLz48cmVjdCB4PSIxMSIgeT0iMCIgd2lkdGg9IjIiIGhlaWdodD0iNSIgcng9IjEiIGZpbGw9IiNGRkY1RTEiLz48Y2lyY2xlIGN4PSI4IiBjeT0iOSIgcj0iNi41IiBmaWxsPSIjRkZGNUUxIi8+PGNpcmNsZSBjeD0iNSIgY3k9IjgiIHI9IjEiIGZpbGw9IiMzMzMiLz48Y2lyY2xlIGN4PSIxMSIgY3k9IjgiIHI9IjEiIGZpbGw9IiMzMzMiLz48Y2lyY2xlIGN4PSI0IiBjeT0iOS41IiByPSIxIiBmaWxsPSIjRkZBQUE2Ii8+PGNpcmNsZSBjeD0iMTIiIGN5PSI5LjUiIHI9IjEiIGZpbGw9IiNGRkFBQTYiLz48cGF0aCBkPSJNNi41IDExUTggMTIgOS41IDExIiBzdHJva2U9IiMzMzMiIGZpbGw9Im5vbmUiIHN0cm9rZS13aWR0aD0iMC44Ii8+PC9zdmc+";

        function initialSetupDraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "14px Arial";
            ctx.fillText("🍰", food.x * gridSize + 1, food.y * gridSize + 13);
            // FIXED: Using index [0] to read list position properly
            ctx.drawImage(hachiwareImg, snake[0].x * gridSize, snake[0].y * gridSize, gridSize, gridSize);
        }

        function pressStartButton() {
            document.getElementById("startScreen").style.display = "none";
            if (!isPlaying) {
                isPlaying = true;
                startGame();
            }
        }

        function startGame() {
            placeFood();
    if (gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(updateGame, 160); 
}

function updateGame() {
    if (!isPlaying) return;

    // FIXED: Correctly tracking head via explicit array index index [0]
    const head = {x: snake[0].x + dx, y: snake[0].y + dy};
    
    if (head.x < 0) head.x = tileCount - 1;
    if (head.x >= tileCount) head.x = 0;
    if (head.y < 0) head.y = tileCount - 1;
    if (head.y >= tileCount) head.y = 0;

    for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
            gameOver();
            return;
        }
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById("score").innerText = score;
        
        if (score > highScore) {
            highScore = score;
            localStorage.setItem("chiikawaHighScore", highScore);
            document.getElementById("high-score").innerText = highScore;
        }
        placeFood();
    } else {
        snake.pop();
    }

    draw();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.font = "14px Arial";
    ctx.fillText("🍰", food.x * gridSize + 1, food.y * gridSize + 13);

    for (let i = 0; i < snake.length; i++) {
        let imgToDraw;
        if (i === 0) {
            imgToDraw = hachiwareImg;  
        } else if (i % 2 === 0) {
            imgToDraw = chiikawaImg;   
        } else {
            imgToDraw = usagiImg;     
        }
        ctx.drawImage(imgToDraw, snake[i].x * gridSize, snake[i].y * gridSize, gridSize, gridSize);
    }
}

function placeFood() {
    if (snake.length >= tileCount * tileCount) {
        gameWin();
        return;
    }

    food.x = Math.floor(Math.random() * tileCount);
    food.y = Math.floor(Math.random() * tileCount);
    
    for (let i = 0; i < snake.length; i++) {
        if (food.x === snake[i].x && food.y === snake[i].y) {
            placeFood();
            break;
                }
            }
}

function gameWin() {
    isPlaying = false;
    clearInterval(gameInterval);
    alert("🏆 Incredible! You completely filled the grid and beat the game! You are a Chiikawa Master! 🎉");
    resetBoard();
}

function gameOver() {
    isPlaying = false;
    clearInterval(gameInterval);
    // FIXED: Re-added missing template literal backticks around alert string
    alert(`Game Over! Your Score: ${score}`);
    resetBoard();
}

function resetBoard() {
    snake = [{x: 10, y: 10}];
    dx = 1; dy = 0;
    score = 0;
    document.getElementById("score").innerText = score;
    document.getElementById("startScreen").style.display = "flex";
    initialSetupDraw();
}

function changeDirection(dir) {
    if (!isPlaying) return;
    if (dir === "UP" && dy === 0) { dx = 0; dy = -1; }
    if (dir === "DOWN" && dy === 0) { dx = 0; dy = 1; }
    if (dir === "LEFT" && dx === 0) { dx = -1; dy = 0; }
    if (dir === "RIGHT" && dx === 0) { dx = 1; dy = 0; }
}

window.addEventListener("keydown", e => {
    if (e.key === "ArrowUp") changeDirection("UP");
    if (e.key === "ArrowDown") changeDirection("DOWN");
    if (e.key === "ArrowLeft") changeDirection("LEFT");
    if (e.key === "ArrowRight") changeDirection("RIGHT");
});

let loadedCount = 0;
function checkLoad() {
    loadedCount++;
    if(loadedCount === 3) initialSetupDraw();
}
hachiwareImg.onload = checkLoad;
chiikawaImg.onload = checkLoad;
usagiImg.onload = checkLoad;
