<body>

    <div class="header">
        <h1>🍡 Chiikawa Snack Slither 🍰</h1>
        <div class="score-container">
            <div>Score: <span id="score">0</span></div>
            <div>Best: <span id="high-score">0</span></div>
        </div>
    </div>
    
    <div class="canvas-container" id="swipeArea">
        <!-- Interactive Start Overlay Menu -->
        <div id="startScreen" class="start-screen">
            <div class="chiikawa-btn-container" onpointerdown="pressStartButton(event)" onclick="pressStartButton(event)">
                <div class="chiikawa-btn-face"></div>
                <div class="chiikawa-btn-text">TAP TO PLAY</div>
            </div>
        </div>
        <canvas id="gameCanvas" width="320" height="320"></canvas>
    </div>

    <div class="instructions">📱 Swipe anywhere on the box to turn!</div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 16; 
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}]; 
        let food = {x: 5, y: 5};
        let dx = 1; 
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("chiikawaHighScore") || 0;
        let gameInterval;
        let isPlaying = false;

        document.getElementById("high-score").innerText = highScore;

        // --- COMPATIBILITY BASE64 ILLUSTRATIONS ---
        const hachiwareImg = new Image();
        hachiwareImg.src = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiI+PGNpcmNsZSBjeD0iOCIgY3k9IjgiIHI9IjciIGZpbGw9IiNmZmZmZmYiLz48cGF0aCBkPSJNMSA1UTggLTEgMTUgNUwxNSAxUTggLTIgMSAxWiIgZmlsbD0iI0EwRTdFNSIvPjxjaXJjbGUgY3g9IjUiIGN5PSI3IiByPSIxIiBmaWxsPSIjMzMzIi8+PGNpcmNsZSBjeD0iMTEiIGN5PSI3IiByPSIxIiBmaWxsPSIjMzMzIi8+PHBhdGggZD0iTTUgMTBRIDggMTIgMTEgMTAiIHN0cm9rZT0iIzMzMyIgZmlsbD1ub25lIiBzdHJva2Utd2lkdGg9IjAuOCIvPjwvc3ZnPg==";

        const chiikawaImg = new Image();
        chiikawaImg.src = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiI+PGNpcmNsZSBjeD0iOCIgY3k9IjgiIHI9IjciIGZpbGw9IiNmZmZmZmYiIHN0cm9rZT0iI0ZGQ0NENSIgc3Ryb2tlLXdpZHRoPSIwLjUiLz48Y2lyY2xlIGN4PSI1IiBjeT0iNyIgcj0iMSIgZmlsbD0iIzMzMyIvPjxjaXJjbGUgY3g9IjExIiBjeT0iNyIgcj0iMSIgZmlsbD0iIzMzMyIvPjxjaXJjbGUgY3g9IjQiIGN5PSI4LjUiIHI9IjEiIGZpbGw9IiNGRkNDRDUiLz48Y2lyY2xlIGN4PSIxMiIgY3k9IjguNSIgcj0iMSIgZmlsbD0iI0ZGQ0NENSIvPjxwYXRoIGQ9Ik02LjUgMTBRIDggMTEgOS41IDEwIiBzdHJva2U9IiMzMzMiIGZpbGw9Im5vbmUiIHN0cm9rZS13aWR0aD0iMC44Ii8+PC9zdmc+";

        const usagiImg = new Image();
        usagiImg.src = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiI+PHJlY3QgeD0iMyIgeT0iMCIgd2lkdGg9IjIiIGhlaWdodD0iNSIgcng9IjEiIGZpbGw9IiNGRkY1RTEiLz48cmVjdCB4PSIxMSIgeT0iMCIgd2lkdGg9IjIiIGhlaWdodD0iNSIgcng9IjEiIGZpbGw9IiNGRkY1RTEiLz48Y2lyY2xlIGN4PSI4IiBjeT0iOSIgcj0iNi41IiBmaWxsPSIjRkZGNUUxIi8+PGNpcmNsZSBjeD0iNSIgY3k9IjgiIHI9IjEiIGZpbGw9IiMzMzMiLz48Y2lyY2xlIGN4PSIxMSIgY3k9IjgiIHI9IjEiIGZpbGw9IiMzMzMiLz48Y2lyY2xlIGN4PSI4LjUiIHk9IjkuNSIgcj0iMSIgZmlsbD0iI0ZGQUE2NiIvPjxjaXJjbGUgY3g9IjExLjUiIHk9IjkuNSIgcj0iMSIgZmlsbD0iI0ZGQUE2NiIvPjxwYXRoIGQ9Ik02LjUgMTRRedggMTUgOS41IDE0IiBzdHJva2U9IiMzMzMiIGZpbGw9Im5vbmUiIHN0cm9rZS13aWR0aD0iMC44Ii8+PC9zdmc+";

        function initialSetupDraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "14px Arial";
            ctx.fillText("🍰", food.x * gridSize + 1, food.y * gridSize + 13);
            ctx.drawImage(hachiwareImg, snake[0].x * gridSize, snake[0].y * gridSize, gridSize, gridSize);
        }

        function pressStartButton(event) {
            if (event) event.preventDefault();
            document.getElementById("startScreen").style.display = "none";
            if (!isPlaying) {
                isPlaying = true;
                startGame();
            }
        }

        function startGame() {
            placeFood();
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 160); 
        }

        function updateGame() {
            if (!isPlaying) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            if (head.x < 0) head.x = tileCount - 1;
            if (head.x >= tileCount) head.x = 0;
            if (head.y < 0) head.y = tileCount - 1;
            if (head.y >= tileCount) head.y = 0;

            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById("score").innerText = score;
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("chiikawaHighScore", highScore);
                    document.getElementById("high-score").innerText = highScore;
                }
                placeFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
